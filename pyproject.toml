[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pilar-embedded"
version = "1.3.3"
description = "PILAR Embedded — standalone machine health inference engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "shap>=0.44",
]

[project.scripts]
pilar-embedded = "pilar_embedded:main"

[tool.setuptools.packages.find]
include = ["pilar_embedded*"]

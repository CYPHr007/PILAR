services:
  - type: web
    name: pilar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 etape7:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # you fill this in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: pilar-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: pilar-db
    plan: free

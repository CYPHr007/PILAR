<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Status — NOUS</title>
<style>
:root{
  --bg:#0d0d0f;--surface:#16181d;--surface2:#1e2027;--surface3:#262830;
  --border:#2a2d35;--border2:#333640;
  --text:#e8eaf0;--text2:#9ca3b0;--text3:#5c6270;
  --green:#34d399;--green-dim:rgba(52,211,153,.1);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,.1);
  --red:#f87171;--red-dim:rgba(248,113,113,.1);
  --accent:#0d9488;--accent-dim:rgba(13,148,136,.12);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --r:10px;--r-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;}

/* ── Top bar ── */
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:16px;position:sticky;top:0;z-index:50;}
.topbar-logo{font-size:15px;font-weight:700;letter-spacing:-.3px;color:var(--text);}
.topbar-logo span{color:var(--accent);}
.topbar-sep{width:1px;height:18px;background:var(--border2);}
.topbar-title{font-size:13px;color:var(--text2);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.topbar-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r-sm);
  border:1px solid var(--border2);background:var(--surface2);color:var(--text2);
  font-size:12px;font-weight:500;text-decoration:none;cursor:pointer;transition:background .15s;}
.topbar-btn:hover{background:var(--surface3);color:var(--text);}
.refresh-btn{animation:none;}
.refresh-btn.spinning svg{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Body ── */
.body{padding:24px;max-width:1400px;margin:0 auto;}

/* ── Group section ── */
.group-section{margin-bottom:28px;}
.group-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.group-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.group-name{font-size:14px;font-weight:600;}
.group-count{font-size:11px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 8px;}
.group-live-badge{font-size:10px;font-weight:700;color:var(--green);background:var(--green-dim);border:1px solid rgba(52,211,153,.2);border-radius:20px;padding:2px 8px;display:flex;align-items:center;gap:4px;}
.group-alert-badge{font-size:10px;font-weight:700;color:var(--red);background:var(--red-dim);border:1px solid rgba(248,113,113,.2);border-radius:20px;padding:2px 8px;}

/* ── Fleet grid ── */
.fleet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}

/* ── Machine card ── */
.machine-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;display:flex;flex-direction:column;gap:10px;
  transition:border-color .15s,background .15s;text-decoration:none;color:inherit;position:relative;overflow:hidden;}
.machine-card:hover{border-color:var(--border2);background:var(--surface2);}
.machine-card.is-alert{border-color:rgba(248,113,113,.3);}
.machine-card.is-live{border-color:rgba(52,211,153,.25);}

/* Live pulse bar at top */
.live-bar{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);
  animation:livebar 2s ease-in-out infinite;}
@keyframes livebar{0%,100%{opacity:.3}50%{opacity:1}}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-name{font-size:13px;font-weight:600;line-height:1.3;word-break:break-word;}
.card-type{font-size:10px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:.5px;}
.card-status{flex-shrink:0;}

/* Risk display */
.risk-val{font-size:24px;font-weight:700;line-height:1;letter-spacing:-1px;}
.risk-label{font-size:10px;color:var(--text3);margin-top:2px;}
.risk-ok{color:var(--green);}
.risk-warn{color:var(--amber);}
.risk-crit{color:var(--red);}

/* Live stats row */
.live-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border-radius:var(--r-sm);padding:8px 10px;}
.live-stat-label{font-size:10px;color:var(--text3);}
.live-stat-val{font-size:12px;font-weight:600;margin-top:2px;}

/* Status pill */
.status-pill{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;
  border-radius:20px;padding:3px 8px;}
.pill-live{background:var(--green-dim);color:var(--green);border:1px solid rgba(52,211,153,.2);}
.pill-ok{background:rgba(100,100,100,.1);color:var(--text3);border:1px solid var(--border);}
.pill-warn{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(251,191,36,.2);}
.pill-crit{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,.2);}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.card-footer{font-size:10px;color:var(--text3);}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 20px;color:var(--text3);}

/* ── Summary bar ── */
.summary-bar{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.summary-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 20px;min-width:120px;}
.summary-stat-val{font-size:22px;font-weight:700;line-height:1;}
.summary-stat-label{font-size:11px;color:var(--text3);margin-top:4px;}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="topbar-logo">PIL<span>AR</span></span>
  <div class="topbar-sep"></div>
  <span class="topbar-title">Fleet Status</span>
  <div class="topbar-right">
    <button class="topbar-btn refresh-btn" id="refresh-btn" onclick="load(true)">
      <svg id="refresh-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" style="width:13px;height:13px;stroke-width:2">
        <path d="M13.5 8A5.5 5.5 0 112.5 5M2.5 2v3h3"/>
      </svg>
      Refresh
    </button>
    <a href="/monitor" class="topbar-btn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" style="width:13px;height:13px;stroke-width:2"><path d="M10 12L6 8l4-4"/></svg>
      Dashboard
    </a>
  </div>
</div>

<div class="body">
  <!-- Search + summary row -->
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
    <div style="position:relative;flex:1;min-width:220px;max-width:380px;">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"
        style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text3);pointer-events:none">
        <circle cx="6.5" cy="6.5" r="4.5"/><path d="M10.5 10.5l2.5 2.5"/>
      </svg>
      <input id="fleet-search" type="text" placeholder="Search by machine name or group…"
        oninput="applySearch(this.value)"
        autocomplete="off"
        style="width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px 8px 32px;color:var(--text);font-size:13px;outline:none;">
    </div>
    <div id="summary-bar" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
  </div>
  <!-- Groups + machines -->
  <div id="fleet-container"></div>
</div>

<script>
var _data = {machines:[], groups:[]};
var _autoRefresh = null;

function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

function _riskClass(r){
  if (r === null || r === undefined) return '';
  if (r >= 60) return 'risk-crit';
  if (r >= 30) return 'risk-warn';
  return 'risk-ok';
}
function _pillClass(m){
  if (m.live && m.live.running) return 'pill-live';
  if (!m.last_risk && m.last_risk !== 0) return 'pill-ok';
  if (m.last_risk >= 60) return 'pill-crit';
  if (m.last_risk >= 30) return 'pill-warn';
  return 'pill-ok';
}
function _fmtDate(iso){
  if (!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function _fmtAgo(iso){
  if (!iso) return '';
  var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 60) return diff+'s ago';
  if (diff < 3600) return Math.floor(diff/60)+'m ago';
  if (diff < 86400) return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}

function _DESK_COLOR(color){
  var MAP = {teal:'#0d9488',blue:'#3b82f6',amber:'#f59e0b',red:'#ef4444',purple:'#8b5cf6',green:'#22c55e',pink:'#ec4899',gray:'#6b7280'};
  return MAP[color] || '#7A5C1E';
}

function renderCard(m){
  var isLive = m.live && m.live.running;
  var isAlert = m.last_prediction === 1 && m.last_risk >= 60;
  var cls = 'machine-card'+(isAlert?' is-alert':'')+(isLive?' is-live':'');
  var pill = _pillClass(m);

  var riskHtml = '';
  if (m.last_risk !== null && m.last_risk !== undefined){
    riskHtml = '<div class="risk-val '+_riskClass(m.last_risk)+'">'+Math.round(m.last_risk)+'%</div>'
      +'<div class="risk-label">Risk score</div>';
  } else {
    riskHtml = '<div style="font-size:12px;color:var(--text3)">No data yet</div>';
  }

  var pillHtml = '';
  if (isLive){
    pillHtml = '<span class="status-pill pill-live"><span class="pulse"></span>Live</span>';
  } else if (m.last_risk >= 60){
    pillHtml = '<span class="status-pill pill-crit">Critical</span>';
  } else if (m.last_risk >= 30){
    pillHtml = '<span class="status-pill pill-warn">Warning</span>';
  } else if (m.last_risk !== null && m.last_risk !== undefined){
    pillHtml = '<span class="status-pill pill-ok">Normal</span>';
  }

  var liveStatsHtml = '';
  if (isLive){
    liveStatsHtml = '<div class="live-stats">'
      +'<div><div class="live-stat-label">Rows</div><div class="live-stat-val">'+((m.live.rows||0).toLocaleString())+'</div></div>'
      +'<div><div class="live-stat-label">Alerts</div><div class="live-stat-val" style="color:'+(m.live.alerts>0?'var(--red)':'var(--text2)')+'">'+( m.live.alerts||0)+'</div></div>'
      +'<div><div class="live-stat-label">File</div><div class="live-stat-val" style="font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+esc(m.live.file)+'">'+esc(m.live.file||'—')+'</div></div>'
      +'</div>';
  }

  var footer = m.last_ts ? '<div class="card-footer">Last reading: '+_fmtAgo(m.last_ts)+'</div>' : '';

  return '<a href="/machine/'+m.id+'" class="'+cls+'">'
    +(isLive?'<div class="live-bar"></div>':'')
    +'<div class="card-top">'
      +'<div><div class="card-name">'+esc(m.name)+'</div>'
        +'<div class="card-type">'+esc(m.asset_type)+'</div></div>'
      +'<div class="card-status">'+pillHtml+'</div>'
    +'</div>'
    +'<div>'+riskHtml+'</div>'
    +liveStatsHtml
    +footer
    +'</a>';
}

function render(){
  var machines = _data.machines;
  var groups   = _data.groups;

  // Summary
  var total   = machines.length;
  var live    = machines.filter(function(m){ return m.live && m.live.running; }).length;
  var alerts  = machines.filter(function(m){ return m.last_risk >= 60; }).length;
  var ok      = machines.filter(function(m){ return m.last_risk !== null && m.last_risk < 30; }).length;

  document.getElementById('summary-bar').innerHTML =
    _statCard(total, 'Total machines', '')
    +_statCard(live, 'Monitoring live', live>0?'color:var(--green)':'')
    +_statCard(alerts, 'Critical', alerts>0?'color:var(--red)':'')
    +_statCard(ok, 'Normal', ok>0?'color:var(--green)':'');

  // Group machines
  var byGroup = {};
  var ungrouped = [];
  machines.forEach(function(m){
    if (m.group_id){ (byGroup[m.group_id]=byGroup[m.group_id]||[]).push(m); }
    else { ungrouped.push(m); }
  });

  var html = '';

  groups.forEach(function(g){
    var members = byGroup[g.id] || [];
    if (!members.length) return;
    var liveCount  = members.filter(function(m){ return m.live && m.live.running; }).length;
    var alertCount = members.filter(function(m){ return m.last_risk >= 60; }).length;
    var col = _DESK_COLOR(g.color);

    html += '<div class="group-section">'
      +'<div class="group-header">'
        +'<div class="group-dot" style="background:'+col+'"></div>'
        +'<span class="group-name">'+esc(g.name)+'</span>'
        +'<span class="group-count">'+members.length+' machine'+(members.length!==1?'s':'')+'</span>'
        +(liveCount?'<span class="group-live-badge"><span class="pulse"></span>'+liveCount+' live</span>':'')
        +(alertCount?'<span class="group-alert-badge">'+alertCount+' critical</span>':'')
      +'</div>'
      +'<div class="fleet-grid">'+members.map(renderCard).join('')+'</div>'
      +'</div>';
  });

  if (ungrouped.length){
    html += '<div class="group-section">'
      +'<div class="group-header">'
        +'<div class="group-dot" style="background:var(--text3)"></div>'
        +'<span class="group-name" style="color:var(--text2)">Ungrouped</span>'
        +'<span class="group-count">'+ungrouped.length+' machine'+(ungrouped.length!==1?'s':'')+'</span>'
      +'</div>'
      +'<div class="fleet-grid">'+ungrouped.map(renderCard).join('')+'</div>'
      +'</div>';
  }

  if (!html){
    html = '<div class="empty">'
      +'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" style="width:36px;height:36px;margin:0 auto 12px;display:block;opacity:.3"><rect x="4" y="8" width="40" height="32" rx="3"/><path d="M4 16h40"/><circle cx="16" cy="28" r="4"/><path d="M22 24h14M22 30h10"/></svg>'
      +'<div style="font-size:14px;margin-bottom:6px;">No machines yet</div>'
      +'<a href="/monitor" style="color:var(--accent);text-decoration:none;">Go to Dashboard →</a>'
      +'</div>';
  }

  document.getElementById('fleet-container').innerHTML = html;
}

function _statCard(val, label, style){
  return '<div class="summary-stat"><div class="summary-stat-val" style="'+style+'">'+val+'</div><div class="summary-stat-label">'+label+'</div></div>';
}

function applySearch(q){
  q = (q||'').trim().toLowerCase();
  var machines = _data.machines;
  var groups   = _data.groups;

  // Build group name lookup
  var gName = {};
  groups.forEach(function(g){ gName[g.id] = g.name.toLowerCase(); });

  if (!q) { render(); return; }

  // Filter machines matching name or group name
  var matched = machines.filter(function(m){
    if (m.name.toLowerCase().indexOf(q) >= 0) return true;
    if (m.group_id && gName[m.group_id] && gName[m.group_id].indexOf(q) >= 0) return true;
    return false;
  });

  // Update summary bar counts
  var live   = matched.filter(function(m){ return m.live && m.live.running; }).length;
  var alerts = matched.filter(function(m){ return m.last_risk >= 60; }).length;
  document.getElementById('summary-bar').innerHTML =
    _statCard(matched.length, 'Results', '')
    +_statCard(live, 'Live', live>0?'color:var(--green)':'')
    +_statCard(alerts, 'Critical', alerts>0?'color:var(--red)':'');

  if (!matched.length){
    document.getElementById('fleet-container').innerHTML =
      '<div class="empty">No machines match "<b>'+esc(q)+'</b>"</div>';
    return;
  }

  // Show as a single flat group
  document.getElementById('fleet-container').innerHTML =
    '<div class="group-section">'
    +'<div class="group-header">'
      +'<span class="group-name" style="color:var(--text2)">Results for "'+esc(q)+'"</span>'
      +'<span class="group-count">'+matched.length+' machine'+(matched.length!==1?'s':'')+'</span>'
    +'</div>'
    +'<div class="fleet-grid">'+matched.map(renderCard).join('')+'</div>'
    +'</div>';
}

function load(spin){
  if (spin){
    var btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    setTimeout(function(){ btn.classList.remove('spinning'); }, 800);
  }
  fetch('/api/fleet/status', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){ _data = d; var q=document.getElementById('fleet-search').value; q?applySearch(q):render(); })
    .catch(function(){ });
}

// Auto-refresh every 5s
load(false);
_autoRefresh = setInterval(function(){ load(false); }, 5000);
</script>
<style>@keyframes _pgin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}body{animation:_pgin 0.18s ease both;}</style>
<script>(function(){document.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;var h=a.getAttribute('href');if(!h||h===''||h.startsWith('#')||h.startsWith('javascript')||h.startsWith('http')||a.target==='_blank'||e.ctrlKey||e.metaKey||e.shiftKey)return;e.preventDefault();document.body.style.transition='opacity 0.13s ease,transform 0.13s ease';document.body.style.opacity='0';document.body.style.transform='translateY(-4px)';setTimeout(function(){window.location.href=h;},140);},true);})();</script></body>
</html>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#08090c;--surface:#0f1117;--surface2:#131720;
  --border:#1c2130;--border2:#252d3d;
  --accent:#0d9488;--accent-dim:rgba(13,148,136,0.12);
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --r:6px;--r-sm:4px;
  --sans:'DM Sans',system-ui,sans-serif;
  --serif:'DM Serif Display',Georgia,serif;
  --mono:'JetBrains Mono','IBM Plex Mono',monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  /* backward-compat */
  --black:var(--text);--white:var(--bg);
  --g1:var(--surface);--g2:var(--border);--g3:var(--text3);--g4:var(--text2);--g5:var(--text);
  --teal:var(--accent);--tl:var(--accent);--teal-dim:var(--accent-dim);
  --red:#f87171;--red-dim:rgba(248,113,113,0.12);
  --green:#34d399;--green-dim:rgba(52,211,153,0.10);
  --amber:#fbbf24;
}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);}
.auth-layout{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;}
.canvas-side{position:fixed;inset:0;z-index:0;overflow:hidden;}
#pillar-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;}
.sig-chip{position:absolute;font-family:var(--mono);font-size:9px;font-weight:300;
  letter-spacing:.1em;color:var(--accent);background:rgba(13,148,136,0.08);
  border:1px solid rgba(13,148,136,0.25);padding:5px 9px;border-radius:var(--r-sm);
  pointer-events:none;animation:chippulse 5s ease-in-out infinite;}
.sig-chip::before{content:'';display:inline-block;width:4px;height:4px;
  background:var(--accent);border-radius:50%;margin-right:6px;vertical-align:middle;}
.sc-tl{top:64px;left:20px;animation-delay:0s;}
.sc-bl{bottom:64px;left:20px;animation-delay:2.1s;}
.sc-tr{top:104px;right:20px;animation-delay:1.0s;}
.sc-br{bottom:104px;right:20px;animation-delay:3.2s;}
.sc-bm{bottom:20px;left:50%;transform:translateX(-50%);animation-delay:4.0s;
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:var(--text3);border:none;background:transparent;padding:0;}
.sc-bm::before{display:none;}
@keyframes chippulse{0%,100%{opacity:0.4;}50%{opacity:0.85;}}
.form-side{position:relative;z-index:10;width:420px;min-width:320px;max-height:94vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:0 0 40px rgba(13,148,136,0.08),0 8px 32px rgba(0,0,0,0.4);
  padding:44px 40px 36px;}
.form-side::-webkit-scrollbar{width:4px;}
.form-side::-webkit-scrollbar-track{background:transparent;}
.form-side::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.form-topbar{display:flex;align-items:center;gap:8px;margin-bottom:22px;
  padding-bottom:18px;border-bottom:1px solid var(--border);}
.ftb-dot{width:5px;height:5px;background:var(--accent);border-radius:50%;flex-shrink:0;}
@keyframes dotpulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
.ftb-txt{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  color:var(--text3);text-transform:uppercase;}
.form-logo{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--text);
  margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase;}
.form-tagline{font-family:var(--mono);font-size:10px;font-weight:300;color:var(--text3);margin-bottom:28px;letter-spacing:.06em;}
.flbl{font-family:var(--mono);font-size:10px;font-weight:300;letter-spacing:.10em;color:var(--text3);
  text-transform:uppercase;margin-bottom:6px;display:block;margin-top:16px;}
.fi{width:100%;padding:10px 0;background:transparent;
  border:none;border-bottom:1px solid var(--g2);color:var(--black);
  font-size:13px;font-family:var(--sans);outline:none;
  transition:border-color .2s;}
.fi:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.fi::placeholder{color:var(--text3);}
.btn-submit{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;
  font-size:13px;font-weight:500;font-family:var(--sans);border-radius:var(--r);
  cursor:pointer;margin-top:22px;letter-spacing:.04em;
  transition:opacity .15s,box-shadow .2s;}
.btn-submit:hover{opacity:.90;box-shadow:0 0 20px rgba(13,148,136,0.3);}
.btn-demo{width:100%;padding:11px;background:transparent;color:var(--text2);
  border:1px solid var(--border);border-radius:var(--r);font-size:12px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  text-decoration:none;transition:border-color .15s,color .15s;}
.btn-demo:hover{border-color:var(--accent);color:var(--accent);}
.auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0 14px;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-divider span{font-family:var(--mono);font-size:9px;color:var(--text3);white-space:nowrap;letter-spacing:.08em;}
.demo-hint{font-family:var(--mono);font-size:9px;color:var(--text3);text-align:center;margin-top:5px;line-height:1.6;letter-spacing:.06em;}
.auth-err{padding:10px 14px;background:var(--red-dim);border-left:2px solid var(--red);border-radius:var(--r-sm);
  font-size:12px;color:var(--red);margin-top:14px;}
.auth-link{text-align:center;margin-top:16px;font-size:11px;color:var(--text3);}
.auth-link a{color:var(--accent);text-decoration:none;}
.auth-link a:hover{text-decoration:underline;}
.verify-box{text-align:center;padding:12px 0;}
.verify-icon{width:46px;height:46px;background:var(--accent-dim);
  border:1px solid rgba(13,148,136,0.25);border-radius:var(--r);display:flex;align-items:center;
  justify-content:center;margin:0 auto 18px;color:var(--accent);}
.verify-title{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--text);margin-bottom:8px;}
.verify-sub{font-size:13px;color:var(--text2);line-height:1.65;}
.verify-note{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:16px;}
.btn-resend{width:100%;padding:11px;margin-top:20px;background:transparent;
  border:1px solid var(--border);border-radius:var(--r);color:var(--text2);
  font-size:12px;font-weight:500;font-family:var(--sans);cursor:pointer;
  transition:border-color .15s,color .15s;}
.btn-resend:hover{border-color:var(--accent);color:var(--accent);}
.lang-sw{position:fixed;top:14px;right:14px;display:flex;gap:2px;
  background:rgba(15,17,23,0.9);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:3px;z-index:99;backdrop-filter:blur(12px);}
.lang-sw button{padding:4px 10px;border:none;font-family:var(--mono);font-size:9px;
  font-weight:400;cursor:pointer;background:transparent;color:var(--text3);border-radius:3px;transition:all .15s;}
.lang-sw button.active{background:var(--accent);color:#fff;}
@media(max-width:640px){
  .form-side{width:calc(100vw - 28px);min-width:0;padding:32px 22px 28px;}
  .sig-chip:not(.sc-bm){display:none;}
}
/* ── Desktop app mode (pywebview detected) ── */
body.desktop .form-side{width:480px;padding:52px 48px 44px;}
body.desktop .form-logo{font-size:30px;}
body.desktop .form-tagline{font-size:11px;margin-bottom:30px;}
body.desktop .sig-chip{font-size:9px;padding:5px 10px;}
body.desktop .sc-tl{top:80px;left:32px;}
body.desktop .sc-bl{bottom:80px;left:32px;}
body.desktop .sc-tr{top:120px;right:32px;}
body.desktop .sc-br{bottom:120px;right:32px;}
body.desktop .fi{padding:12px 0;font-size:14px;}
body.desktop .btn-submit{padding:14px;font-size:15px;}
body.desktop .btn-demo{padding:13px;font-size:14px;}
body.desktop .form-topbar{margin-bottom:28px;}
/* ── Input with icon ── */
.fi-wrap{position:relative;margin-bottom:2px;}
.fi-wrap .fi{padding-left:38px;padding-right:38px;}
.fi-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  color:var(--text3);pointer-events:none;transition:color .2s;}
.fi-wrap:focus-within .fi-icon{color:var(--accent);}
.fi-wrap .fi:focus{border-color:var(--accent);}
/* ── Password toggle ── */
.pw-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;
  display:flex;align-items:center;transition:color .15s;line-height:1;}
.pw-eye:hover{color:var(--accent);}
/* ── Password strength ── */
.pw-strength{margin-top:7px;margin-bottom:2px;}
.pw-bars{display:flex;gap:3px;margin-bottom:4px;}
.pw-bar{flex:1;height:3px;background:var(--g2);transition:background .3s;}
.pw-label{font-family:var(--mono);font-size:9px;font-weight:300;letter-spacing:.06em;color:var(--g3);transition:color .3s;height:12px;}
/* ── Form section ── */
.form-fields{display:flex;flex-direction:column;gap:14px;margin-bottom:4px;}
.field-group{display:flex;flex-direction:column;gap:0;}
.flbl{margin-bottom:5px;}
/* ── Input hint ── */
.fi-hint{font-family:var(--mono);font-size:9px;font-weight:300;color:var(--g3);margin-top:4px;line-height:1.4;}
</style></head><body>

function _tA(k){return(_TA[_aLang]||_TA.fr)[k]||k;}
function _authSetLang(l){

    var k=el.getAttribute('data-t'),v=_tA(k);
    if(el.tagName==='INPUT'){el.placeholder=v;}else{el.innerHTML=v;}

    if(v&&v!==k)el.textContent=v;
  });
}
(function(){_authSetLang(_aLang);})();
document.addEventListener('DOMContentLoaded',function(){

});

<div class="auth-layout">
  <div class="canvas-side" id="canvas-wrap">
    <canvas id="pillar-canvas"></canvas>
    <div class="sig-chip sc-tl">VIB &middot; 0.61 mm/s</div>
    <div class="sig-chip sc-bl">T.PAL &middot; 44.8 &deg;C</div>
    <div class="sig-chip sc-tr">P.SORT &middot; 107.7 bar</div>
    <div class="sig-chip sc-br">DEBIT &middot; 0.395 m&sup3;/h</div>
    <div class="sig-chip sc-bm">NOUS &nbsp;&bull;&nbsp; EARLY PILOT</div>
  </div>
  <div class="form-side">
    <div class="form-logo" data-t="reset_title">Nouveau mot de passe</div>
    <div class="form-tagline" data-t="tagline">Plateforme de maintenance prédictive</div>
    {% if error %}<div class="auth-err" {% if error_key %}data-tkey="{{ error_key }}"{% endif %}>{{ error }}</div>{% endif %}
    <form method="POST" action="/reset-password/{{ token }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-fields">
        <div class="field-group">
          <label class="flbl" for="pw" data-t="lbl_new_pw">Nouveau mot de passe</label>
          <div class="fi-wrap">
            <svg class="fi-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input class="fi" type="password" id="pw" name="password" data-t-ph="pw_ph" placeholder="8 caractères minimum" autocomplete="new-password" required minlength="8">
            <button type="button" class="pw-eye" onclick="togglePw('pw',this)" tabindex="-1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="pw-strength" id="pwStrength" style="display:none">
            <div class="pw-bars"><div class="pw-bar" id="pb1"></div><div class="pw-bar" id="pb2"></div><div class="pw-bar" id="pb3"></div><div class="pw-bar" id="pb4"></div></div>
            <div class="pw-label" id="pwLbl"></div>
          </div>
        </div>
        <div class="field-group">
          <label class="flbl" for="pw2" data-t="lbl_confirm_pw">Confirmer</label>
          <div class="fi-wrap">
            <svg class="fi-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input class="fi" type="password" id="pw2" name="password2" placeholder="••••••••" autocomplete="new-password" required>
            <button type="button" class="pw-eye" onclick="togglePw('pw2',this)" tabindex="-1"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
      </div>
      <script>
      function togglePw(id,btn){var inp=document.getElementById(id);var show=inp.type==='password';inp.type=show?'text':'password';btn.style.color=show?'var(--tl)':'var(--text3)';}
      document.getElementById('pw').addEventListener('input',function(){
        var v=this.value,s=document.getElementById('pwStrength'),l=document.getElementById('pwLbl');
        s.style.display=v?'block':'none';if(!v)return;
        var score=0;if(v.length>=8)score++;if(v.length>=12)score++;if(/[A-Z]/.test(v)&&/[0-9]/.test(v))score++;if(/[^A-Za-z0-9]/.test(v))score++;
        var cols=['#dc2626','#f97316','#eab308','#059669'],lbls=['Faible','Moyen','Bon','Fort'];
        [1,2,3,4].forEach(function(i){var b=document.getElementById('pb'+i);b.style.background=i<=score?cols[score-1]:'var(--border2)';});
        l.textContent=lbls[score-1]||'';l.style.color=cols[score-1]||'var(--text3)';
      });
      </script>
      <button type="submit" class="btn-submit" data-t="btn_reset">Enregistrer le nouveau mot de passe</button>
    </form>
    <div class="auth-link" data-t="link_back_login"><a href="/login">Retour à la connexion</a></div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var PRM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var wrap=document.getElementById('canvas-wrap');
  var cvs=document.getElementById('pillar-canvas');
  if(!wrap||!cvs)return;
  var ctx=cvs.getContext('2d');
  var W=0,H=0;
  function resize(){W=cvs.width=wrap.offsetWidth||window.innerWidth;H=cvs.height=wrap.offsetHeight||window.innerHeight;}
  var sensors=[
    {y:0.11,amp:0.042,freq:0.056,noise:0.80,phase:0.0,col:[13,148,136],lw:1.5,lbl:'VIB',cA:0},
    {y:0.27,amp:0.021,freq:0.011,noise:0.13,phase:1.9,col:[20,184,166],lw:1.1,lbl:'TEMP',cA:0},
    {y:0.45,amp:0.029,freq:0.022,noise:0.40,phase:3.3,col:[94,234,212],lw:1.0,lbl:'FLOW',cA:0},
    {y:0.63,amp:0.032,freq:0.017,noise:0.43,phase:0.8,col:[45,212,191],lw:1.0,lbl:'PRESS',cA:0},
    {y:0.81,amp:0.018,freq:0.039,noise:0.58,phase:2.5,col:[148,163,184],lw:0.8,lbl:'CUR',cA:0},
  ];
  var NL=2048,noise=new Float32Array(NL);
  for(var i=0;i<NL;i++)noise[i]=Math.random()*2-1;
  var scroll=0,scanY=-60,lastTs=0;
  /* ── Mouse tracking ── */
  var mx=window.innerWidth/2,my=window.innerHeight/2,mxSmooth=mx,mySmooth=my;
  if(!PRM){
    document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;},{passive:true});
  }
  /* ── Chip parallax ── */
  var chips=document.querySelectorAll('.sig-chip');
  function updateChips(){
    var cx=(mxSmooth/window.innerWidth-0.5)*2;
    var cy=(mySmooth/window.innerHeight-0.5)*2;
    chips.forEach(function(chip,i){
      var d=(i%3+1)*5;
      var tx=cx*d*-1,ty=cy*d*-1;
      chip.style.transition='transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94)';
      if(chip.classList.contains('sc-bm'))
        chip.style.transform='translateX(calc(-50% + '+tx+'px))';
      else
        chip.style.transform='translate('+tx+'px,'+ty+'px)';
    });
  }
  function hexGrid(){
    var sz=26,hx=sz*1.732,hy=sz*1.5;
    ctx.fillStyle='rgba(13,148,136,0.05)';
    for(var r=-1,rl=Math.ceil(H/hy)+2;r<rl;r++){
      var ox=(r&1)?hx*0.5:0;
      for(var c=-1,cl=Math.ceil(W/hx)+2;c<cl;c++){
        ctx.beginPath();ctx.arc(c*hx+ox,r*hy,1.1,0,6.283);ctx.fill();
      }
    }
  }
  function vgrid(){
    ctx.lineWidth=0.5;var step=W/10;
    for(var x=step;x<W;x+=step){
      ctx.strokeStyle='rgba(18,26,52,0.60)';
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
  }
  function wave(s,alpha){
    var cy=H*s.y,amp=H*s.amp,r=s.col[0],g=s.col[1],b=s.col[2];
    var ca=s.cA;
    var lw=s.lw+ca*2.2;
    var al=alpha+ca*0.30;
    ctx.beginPath();ctx.lineWidth=lw;
    ctx.strokeStyle='rgba('+r+','+g+','+b+','+al+')';
    for(var x=0;x<=W;x+=2){
      var t=(x+scroll)*s.freq+s.phase,ni=((x+scroll*1.7)|0)&(NL-1);
      var baseY=cy+Math.sin(t)*amp+noise[ni]*amp*s.noise;
      var mdx=x-mxSmooth;
      var xG=Math.exp(-mdx*mdx/(W*W*0.007));
      var pull=(mySmooth-baseY)*ca*xG*0.82;
      x===0?ctx.moveTo(x,baseY+pull):ctx.lineTo(x,baseY+pull);
    }
    ctx.stroke();
    var pts=[];
    for(var x=0;x<=W;x+=4){
      var t=(x+scroll)*s.freq+s.phase,ni=((x+scroll*1.7)|0)&(NL-1);
      var baseY=cy+Math.sin(t)*amp+noise[ni]*amp*s.noise;
      var mdx=x-mxSmooth;
      var xG=Math.exp(-mdx*mdx/(W*W*0.007));
      pts.push([x,baseY+(mySmooth-baseY)*ca*xG*0.82]);
    }
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
    for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
    ctx.lineTo(W,cy+amp*4);ctx.lineTo(0,cy+amp*4);ctx.closePath();
    ctx.fillStyle='rgba('+r+','+g+','+b+','+(al*0.07)+')';ctx.fill();
    ctx.fillStyle='rgba('+r+','+g+','+b+','+(0.38+ca*0.3)+')';
    ctx.font='300 8px "IBM Plex Mono",monospace';ctx.textAlign='left';
    ctx.fillText(s.lbl,10,cy-amp-5);
  }
  function drawGlow(){
    var g=ctx.createRadialGradient(mxSmooth,mySmooth,0,mxSmooth,mySmooth,130);
    g.addColorStop(0,'rgba(13,148,136,0.06)');
    g.addColorStop(0.5,'rgba(13,148,136,0.02)');
    g.addColorStop(1,'rgba(13,148,136,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  /* pillar state: slot 0=bottom-left, 1=bottom-right, 2=top-right */
  var _pSlot=0,_pCool=0;
  function drawGreekPillar(){
    var bu=Math.min(H*0.013,11);
    var pw=bu*7,ph=bu*46;
    /* slot positions: [cx_factor_of_pw, sy_offset] */
    var slots=[
      [-0.22, H+bu*4],          /* bottom-left */
      [W+pw*0.22, H+bu*4],      /* bottom-right */
      [W+pw*0.22, -bu*4]        /* top-right */
    ];
    var slotCX=slots[_pSlot][0], slotSY=slots[_pSlot][1];
    var cx=slotCX, sy=slotSY;
    /* proximity target point: center of visible part */
    var tx=(_pSlot===0)?pw*1.2:(W-pw*1.2);
    var ty=(_pSlot===2)?(ph*0.5):(sy-ph*0.5);
    var dist=Math.sqrt((mxSmooth-tx)*(mxSmooth-tx)+(mySmooth-ty)*(mySmooth-ty));
    var prox=Math.max(0,1-dist/(W*0.36));
    /* flee: if cursor too close and cooldown elapsed, jump to next slot */
    _pCool=Math.max(0,_pCool-1);
    if(prox>0.72&&_pCool===0){
      _pSlot=(_pSlot+1)%3;
      _pCool=90; /* ~1.5s cooldown */
    }
    var base=0.038+prox*0.048;
    ctx.save();ctx.globalAlpha=base;
    /* glow on hover */
    if(prox>0.04){
      var ggx=(_pSlot===0)?pw*0.8:(W-pw*0.8);
      var ggy=(_pSlot===2)?(ph*0.4):(sy-ph*0.45);
      var gg=ctx.createRadialGradient(ggx,ggy,0,ggx,ggy,pw*4);
      gg.addColorStop(0,'rgba(0,0,0,'+(prox*0.04)+')');
      gg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.globalAlpha=1;ctx.fillStyle=gg;ctx.fillRect(cx-pw*2,ggy-ph*0.6,pw*6,ph*1.1);
      ctx.globalAlpha=base;
    }
    var c='rgba(13,148,136,0.22)',cd='rgba(13,148,136,0.12)';
    /* stylobate - 3 steps */
    for(var s=0;s<3;s++){
      var sw=pw*(1.7+s*0.28),sh=bu*1.4;
      var sby=sy+s*sh;
      ctx.fillStyle=c;ctx.fillRect(cx-sw/2,sby,sw,sh);
      ctx.fillStyle=cd;ctx.fillRect(cx-sw/2,sby+sh-bu*0.3,sw,bu*0.3);
    }
    /* shaft with entasis taper + 8 flutes */
    var stY=sy,stH=ph*0.78;
    var wTop=pw*0.82,wBot=pw;
    ctx.beginPath();
    ctx.moveTo(cx-wBot/2,stY);ctx.lineTo(cx+wBot/2,stY);
    ctx.lineTo(cx+wTop/2,stY-stH);ctx.lineTo(cx-wTop/2,stY-stH);
    ctx.closePath();ctx.fillStyle=c;ctx.fill();
    /* flutes */
    ctx.globalAlpha=base*0.55;
    for(var f=0;f<8;f++){
      var frac=(f+0.5)/8;
      var fxB=cx-wBot/2+frac*wBot,fxT=cx-wTop/2+frac*wTop;
      var fw=pw*0.06;
      ctx.beginPath();
      ctx.moveTo(fxB-fw,stY);ctx.lineTo(fxB+fw,stY);
      ctx.lineTo(fxT+fw,stY-stH);ctx.lineTo(fxT-fw,stY-stH);
      ctx.closePath();ctx.fillStyle=cd;ctx.fill();
    }
    ctx.globalAlpha=base;
    /* capital echinus (convex curve) */
    var capY=stY-stH,capH=bu*3.5;
    ctx.beginPath();
    ctx.moveTo(cx-wTop/2,capY);
    ctx.bezierCurveTo(cx-wTop/2-bu*0.6,capY-capH*0.4,cx-pw*0.6,capY-capH,cx-pw*0.62,capY-capH);
    ctx.lineTo(cx+pw*0.62,capY-capH);
    ctx.bezierCurveTo(cx+pw*0.6,capY-capH,cx+wTop/2+bu*0.6,capY-capH*0.4,cx+wTop/2,capY);
    ctx.closePath();ctx.fillStyle=c;ctx.fill();
    /* abacus */
    var abH=bu*1.8;
    ctx.fillStyle=c;ctx.fillRect(cx-pw*0.7,capY-capH-abH,pw*1.4,abH);
    ctx.fillStyle=cd;ctx.fillRect(cx-pw*0.7,capY-capH-abH,pw*1.4,bu*0.28);
    ctx.restore();
  }
  function drawParts(dt){
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=0.06*dt;
      p.life-=0.032*dt;
      if(p.life<=0){parts.splice(i,1);continue;}
      ctx.save();ctx.globalAlpha=p.life;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle='rgba('+p.col+',1)';ctx.fill();ctx.restore();
    }
  }
  function loop(ts){
    if(!lastTs){resize();lastTs=ts;}
    var dt=Math.min((ts-lastTs)/16.67,3.5);lastTs=ts;
    mxSmooth+=(mx-mxSmooth)*0.06*dt;
    mySmooth+=(my-mySmooth)*0.06*dt;
    ctx.fillStyle='#08090c';ctx.fillRect(0,0,W,H);
    hexGrid();vgrid();
    if(!PRM)scroll+=0.55*dt;
    sensors.forEach(function(s){
      var cy=H*s.y,dY=Math.abs(mySmooth-cy);
      var tgt=Math.max(0,1-dY/(H*0.20));tgt=tgt*tgt;
      s.cA+=(tgt-s.cA)*0.08*dt;
      wave(s,0.55);
    });
    if(!PRM){
      drawGlow();
      drawGreekPillar();
      drawParts(dt);
      updateChips();
      scanY+=0.20*dt;if(scanY>H+60)scanY=-60;
      var sg=ctx.createLinearGradient(0,scanY-30,0,scanY+30);
      sg.addColorStop(0,'rgba(13,148,136,0)');
      sg.addColorStop(0.5,'rgba(13,148,136,0.038)');
      sg.addColorStop(1,'rgba(13,148,136,0)');
      ctx.fillStyle=sg;ctx.fillRect(0,scanY-30,W,60);
      ctx.strokeStyle='rgba(13,148,136,0.09)';ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(0,scanY);ctx.lineTo(W,scanY);ctx.stroke();
    }
    requestAnimationFrame(loop);
  }
  var rsT=null;
  window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(resize,160);},{passive:true});
  setTimeout(function(){requestAnimationFrame(loop);},200);
})();
</script>
</script></body></html>
